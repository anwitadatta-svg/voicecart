<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceCart</title>

<style>
:root {
  --ink: #1d2433;
  --muted: #5d6678;
  --paper: #f6f8fb;
  --panel: #ffffff;
  --line: #d9dfe9;
  --accent: #0b5fff;
  --good: #0a7a4b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.5;
}

main {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

h1 { font-size: 1.8rem; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; }

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  font: inherit;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
}

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  font-weight: 600;
}

button.listening {
  background: #d92d20;
  border-color: #d92d20;
  color: white;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

input[type=text] {
  flex: 1;
  min-width: 180px;
  font: inherit;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
}

#log {
  margin: 20px 0;
  display: grid;
  gap: 8px;
}

.msg {
  padding: 10px 14px;
  border-radius: 10px;
  max-width: 90%;
  overflow-wrap: anywhere;
}

.you {
  background: #e6eefc;
  justify-self: end;
}

.agent {
  background: white;
  border: 1px solid var(--line);
}

.cart {
  background: white;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
}

.cart h2 { font-size: 1.05rem; margin: 0 0 8px; }

.cart ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

.cart li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 0;
  border-bottom: 1px solid var(--line);
}

.cart .total {
  display: flex;
  justify-content: space-between;
  font-weight: 700;
  padding-top: 10px;
}

.empty { color: var(--muted); }

#pay {
  display: none;
  margin-top: 12px;
  text-align: center;
  text-decoration: none;
  background: var(--good);
  color: white;
  padding: 12px;
  border-radius: 8px;
  font-weight: 600;
}

#status {
  color: var(--muted);
  min-height: 1.5em;
  margin-top: 8px;
}
</style>
</head>

<body>
<main>

<h1>VoiceCart 🛒</h1>

<p class="sub">
Press Speak and say something like
"add running shoes to my cart".
</p>

<div class="row">
  <button id="speak" class="primary">🎤 Speak</button>
  <button id="reset">Clear cart</button>
  <button id="payNow">Checkout</button>
</div>

<div class="row" style="margin-top:8px">
  <input id="typed" type="text"
    placeholder="Or type a command and press Enter">
  <button id="send">Send</button>
</div>

<div id="status" aria-live="polite"></div>

<div id="log" aria-live="polite"></div>

<section class="cart">
  <h2>Your cart</h2>
  <div id="cartBody" class="empty">Nothing here yet.</div>
  <a id="pay" href="#" target="_blank" rel="noopener">
    Pay with PayPal
  </a>
</section>

</main>

<script>
const speakBtn = document.getElementById("speak");
const resetBtn = document.getElementById("reset");
const payNowBtn = document.getElementById("payNow");
const sendBtn = document.getElementById("send");
const typedInput = document.getElementById("typed");
const statusBox = document.getElementById("status");
const logBox = document.getElementById("log");
const cartBody = document.getElementById("cartBody");
const payLink = document.getElementById("pay");

// Browser speech recognition
const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let isListening = false;

function setStatus(message) {
  statusBox.textContent = message;
}

function addMessage(message, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = message;
  logBox.appendChild(div);
}

function speakReply(message) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(message);
  utterance.lang = "en-IN";
  utterance.rate = 1;

  window.speechSynthesis.speak(utterance);
}

// Display cart
function refreshCart() {
  fetch("/cart")
    .then(response => {
      if (!response.ok) throw new Error("Cart request failed");
      return response.json();
    })
    .then(renderCart)
    .catch(error => {
      console.error("Cart error:", error);
      setStatus("Could not refresh cart.");
    });
}

function renderCart(data) {
  cartBody.replaceChildren();

  if (!data.items || data.items.length === 0) {
    cartBody.textContent = "Nothing here yet.";
    cartBody.className = "empty";
    payLink.style.display = "none";
    return;
  }

  cartBody.className = "";

  const ul = document.createElement("ul");

  data.items.forEach(item => {
    const li = document.createElement("li");

    const name = document.createElement("span");
    name.textContent = item.name + " × " + item.qty;

    const price = document.createElement("span");
    price.textContent = "$" +
      Number(item.line_total).toFixed(2);

    li.append(name, price);
    ul.appendChild(li);
  });

  const total = document.createElement("div");
  total.className = "total";

  const totalLabel = document.createElement("span");
  totalLabel.textContent = "Total";

  const totalPrice = document.createElement("span");
  totalPrice.textContent = "$" +
    Number(data.total).toFixed(2);

  total.append(totalLabel, totalPrice);
  cartBody.append(ul, total);
}

// Send command to FastAPI
async function sendCommand(command) {
  if (!command.trim()) return;

  addMessage(command, "you");
  typedInput.value = "";
  setStatus("Processing your command...");

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text: command })
    });

    if (!response.ok) {
      throw new Error("Server returned " + response.status);
    }

    const data = await response.json();

    addMessage(data.reply, "agent");
    speakReply(data.reply);

    if (data.cart) {
      renderCart(data.cart);
    }

    if (data.checkout_url) {
      payLink.href = data.checkout_url;
      payLink.style.display = "block";
    }

    setStatus("Ready.");

  } catch (error) {
    console.error("Chat error:", error);
    setStatus("Could not connect to VoiceCart. Check the server.");
    addMessage("Sorry, something went wrong. Please try again.", "agent");
  }
}

// Initialize speech recognition
function setupSpeechRecognition() {

  if (!SpeechRecognition) {
    setStatus(
      "Speech recognition is not supported in this browser. " +
      "Please use a recent version of Google Chrome."
    );
    speakBtn.disabled = true;
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {
    isListening = true;
    speakBtn.textContent = "🔴 Listening...";
    speakBtn.classList.add("listening");
    setStatus("Listening. Please speak now.");
  };

  recognition.onresult = function(event) {
    const transcript =
      event.results[0][0].transcript.trim();

    setStatus("You said: " + transcript);
    sendCommand(transcript);
  };

  recognition.onerror = function(event) {
    console.error("Speech recognition error:", event.error);

    const messages = {
      "not-allowed": "Microphone permission denied. Allow it in Chrome settings.",
      "service-not-allowed": "Speech recognition service is not allowed.",
      "no-speech": "No speech detected. Please try again.",
      "audio-capture": "No microphone was detected by the browser.",
      "network": "Speech recognition network error. Check your internet connection.",
      "aborted": "Listening was stopped."
    };

    setStatus(messages[event.error] || 
      "Microphone error: " + event.error);
  };

  recognition.onend = function() {
    isListening = false;
    speakBtn.textContent = "🎤 Speak";
    speakBtn.classList.remove("listening");
  };
}

// Speak button
speakBtn.addEventListener("click", function() {

  if (!recognition) {
    setupSpeechRecognition();
  }

  if (!recognition) return;

  try {
    if (isListening) {
      recognition.stop();
    } else {
      recognition.start();
    }
  } catch (error) {
    console.error("Microphone start error:", error);
    setStatus("Could not start microphone. Please try again.");
  }
});

// Typed commands
sendBtn.addEventListener("click", function() {
  sendCommand(typedInput.value);
});

typedInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendCommand(typedInput.value);
  }
});

// Clear cart
resetBtn.addEventListener("click", async function() {
  try {
    const response = await fetch("/reset", {
      method: "POST"
    });

    if (!response.ok) throw new Error("Reset failed");

    logBox.replaceChildren();
    payLink.style.display = "none";
    setStatus("Cart cleared successfully.");
    refreshCart();

  } catch (error) {
    console.error(error);
    setStatus("Could not clear the cart.");
  }
});

// Checkout
payNowBtn.addEventListener("click", async function() {
  try {
    setStatus("Preparing PayPal checkout...");

    const response = await fetch("/checkout", {
      method: "POST"
    });

    if (!response.ok) throw new Error("Checkout failed");

    const data = await response.json();

    if (data.error) {
      setStatus(data.error);
      return;
    }

    if (data.approval_url) {
      payLink.href = data.approval_url;
      payLink.style.display = "block";
      window.location.href = data.approval_url;
    }

  } catch (error) {
    console.error("Checkout error:", error);
    setStatus("Checkout failed. Please check your PayPal settings.");
  }
});

// Start application
setupSpeechRecognition();
refreshCart();

window.addEventListener("focus", refreshCart);

document.addEventListener("visibilitychange", function() {
  if (document.visibilityState === "visible") {
    refreshCart();
  }
});
</script>

</body>
</html>
